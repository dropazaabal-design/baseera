name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Claude plugin bundle matches the source
        run: |
          npm run build:plugin
          if ! git diff --quiet -- claude-plugin; then
            echo "::error::claude-plugin/ is stale. Run 'npm run build:plugin' and commit the result."
            git diff --stat -- claude-plugin
            exit 1
          fi
